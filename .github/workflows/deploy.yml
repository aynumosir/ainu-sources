name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. GitHub keeps a single queued run per group, so the
# newest push replaces any run still waiting, and the Worker never ends up
# on an older commit than the one that finished last.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guards:
    name: Destructive-write guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/ci-guards.sh

  deploy:
    name: Build and deploy the Worker
    needs: guards
    # Manual runs deploy production too, so they are held to the same branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://db.aynu.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          # Matches the devDependency range so the action never falls back
          # to installing its own wrangler.
          wranglerVersion: "4"
          command: deploy
