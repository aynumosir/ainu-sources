name: Archive derivatives

on:
  schedule:
    # Pick up newly approved scans without a manual deploy step.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: "Optional file_revisions.id to process"
        required: false
        type: string
      limit:
        description: "Maximum revisions to process"
        required: false
        default: 10
        type: number

concurrency:
  group: archive-derivatives
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate page images and linearized PDFs
    runs-on: ubuntu-latest
    env:
      DERIVATIVE_RENDER_WINDOW: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install PDF tools
        # The AWS CLI ships with the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
      - name: Install ImageMagick
        # Ubuntu 24.04 packages ImageMagick 6, whose binaries are named
        # convert-im6.q16 and friends; the derivative script calls `magick`.
        env:
          IMAGEMAGICK_VERSION: "7.1.2-27"
          IMAGEMAGICK_SHA256: b2feb70e39f0b3ae474a0bb1ce8123811cb82f7fb80275bfb4e74018fb6cabdd
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o magick.AppImage \
            "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage"
          echo "${IMAGEMAGICK_SHA256}  magick.AppImage" | sha256sum -c -
          chmod +x magick.AppImage
          # Extraction avoids the FUSE dependency an AppImage otherwise needs.
          ./magick.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/imagemagick
          sudo ln -s /opt/imagemagick/AppRun /usr/local/bin/magick
          magick -version
      - run: bun install --frozen-lockfile
      - name: Generate derivatives
        env:
          DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.ARCHIVE_DATABASE_AUTH_TOKEN }}
          R2_BUCKET: ${{ secrets.ARCHIVE_R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.ARCHIVE_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_R2_SECRET_ACCESS_KEY }}
          REVISION: ${{ inputs.revision }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$REVISION" ]; then
            args+=(--revision "$REVISION")
          fi
          args+=(--limit "${LIMIT:-10}")
          bun run archive:gen-derivatives -- "${args[@]}"
